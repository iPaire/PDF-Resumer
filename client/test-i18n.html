<!DOCTYPE html>
<html>
<head>
    <title>Test Internationalization</title>
</head>
<body>
    <h1>Test Language Switching</h1>
    <p>Open the browser developer tools and run these tests:</p>
    
    <h2>Test 1: Set Romanian Language</h2>
    <button onclick="setLanguage('ro')">Set Romanian</button>
    
    <h2>Test 2: Set English Language</h2>
    <button onclick="setLanguage('en')">Set English</button>
    
    <h2>Test 3: Set Spanish Language</h2>
    <button onclick="setLanguage('es')">Set Spanish</button>
    
    <h2>Test 4: Set German Language</h2>
    <button onclick="setLanguage('de')">Set German</button>
    
    <h2>Test 5: Set French Language</h2>
    <button onclick="setLanguage('fr')">Set French</button>
    
    <h2>Test 6: View App</h2>
    <button onclick="window.open('http://localhost:3000', '_blank')">Open App</button>
    
    <script>
        function setLanguage(locale) {
            // Set localStorage
            localStorage.setItem('preferred-locale', locale);
            
            // Set cookie
            document.cookie = `locale=${locale}; path=/; max-age=${60 * 60 * 24 * 365}; SameSite=Lax`;
            
            alert(`Language set to ${locale}. Now open the app to see the changes!`);
        }
        
        // Display current settings
        function displayCurrentSettings() {
            const stored = localStorage.getItem('preferred-locale') || 'not set';
            const cookie = document.cookie.split(';').find(c => c.trim().startsWith('locale='));
            const cookieValue = cookie ? cookie.split('=')[1] : 'not set';
            
            document.getElementById('current').innerHTML = `
                <p><strong>Current Settings:</strong></p>
                <p>localStorage: ${stored}</p>
                <p>Cookie: ${cookieValue}</p>
            `;
        }
        
        // Display current settings on page load
        window.onload = function() {
            const currentDiv = document.createElement('div');
            currentDiv.id = 'current';
            document.body.appendChild(currentDiv);
            displayCurrentSettings();
            setInterval(displayCurrentSettings, 1000);
        };
    </script>
</body>
</html>
